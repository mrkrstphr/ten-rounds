name: Check TenRounds

on:
  push:
    branches: [main, multiplayer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test rules, saves, rooms, build, and production server
        run: npm test
      - name: Build deployment image
        run: docker build --tag tenrounds:ci .
      - name: Smoke-test production-only container
        run: >
          docker run --rm --read-only tenrounds:ci node --input-type=module -e
          "import assert from 'node:assert/strict';
          import { once } from 'node:events';
          import { createAppServer } from './server/index.js';
          const app = await createAppServer();
          app.server.listen(0, '127.0.0.1');
          await once(app.server, 'listening');
          const origin = 'http://127.0.0.1:' + app.server.address().port;
          try {
          assert.equal((await fetch(origin + '/health')).status, 200);
          assert.match(await fetch(origin).then(r => r.text()), /TenRounds/);
          const room = await fetch(origin + '/api/rooms', {
          method: 'POST', headers: { Origin: origin, 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: 'container-smoke', type: 'create', name: 'Image check' })
          }).then(r => r.json());
          assert.equal(room.ok, true);
          } finally { await app.close(); }"
